# serviceaccounts.yaml - one service account per workload type. None of them may talk to the Kubernetes API
# (automountServiceAccountToken: false). The backend account carries the IRSA role, so api and worker get AWS
# credentials (S3, KMS) from the EKS pod-identity webhook instead of access keys in env vars.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pifa.fullname" . }}-backend
  labels:
    {{- include "pifa.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
  {{- if or .Values.serviceAccount.annotations .Values.serviceAccount.roleArn }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.serviceAccount.roleArn }}
    eks.amazonaws.com/role-arn: {{ . | quote }}
    {{- end }}
  {{- end }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pifa.fullname" . }}-web
  labels:
    {{- include "pifa.componentLabels" (dict "root" . "component" "web") | nindent 4 }}
automountServiceAccountToken: false
{{- if .Values.clamav.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pifa.fullname" . }}-clamav
  labels:
    {{- include "pifa.componentLabels" (dict "root" . "component" "clamav") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
