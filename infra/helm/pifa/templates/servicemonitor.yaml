# servicemonitor.yaml - tells the Prometheus Operator to scrape the api and worker Services on the internal
# "management" port (9091), path /actuator/prometheus. Each pod is scraped individually, so per-pod gauges such
# as pifa_live_connections and the HikariCP pool metrics stay separate.
{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "pifa.fullname" . }}
  labels:
    {{- include "pifa.labels" . | nindent 4 }}
    {{- with .Values.monitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      pifa.example.com/metrics: "true"
  namespaceSelector:
    matchNames: [{{ .Release.Namespace }}]
  endpoints:
    - port: management
      path: /actuator/prometheus
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout }}
      # Adds the component (api / worker) as a label on every series, for dashboards and alerts.
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
          targetLabel: component
{{- end }}
