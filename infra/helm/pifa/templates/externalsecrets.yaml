# externalsecrets.yaml - ExternalSecret objects (External Secrets Operator) that copy secrets from the secret
# manager (AWS Secrets Manager / Azure Key Vault / Vault) into Kubernetes Secrets with the names in
# values.yaml `secrets`. Nothing secret is stored in this chart or in Git (architecture.md 12). When
# externalSecrets.enabled is false these objects are not created and the Secrets must already exist.
{{- if .Values.externalSecrets.enabled }}
{{- $store := .Values.externalSecrets.secretStoreRef }}
{{- $refs := .Values.externalSecrets.remoteRefs }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.db.name }}
  labels:
    {{- include "pifa.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $store.name }}
    kind: {{ $store.kind }}
  target:
    name: {{ .Values.secrets.db.name }}
    # The operator owns the Secret: it is deleted with the ExternalSecret.
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.secrets.db.usernameKey }}
      remoteRef: { key: {{ $refs.db.key }}, property: {{ $refs.db.usernameProperty }} }
    - secretKey: {{ .Values.secrets.db.passwordKey }}
      remoteRef: { key: {{ $refs.db.key }}, property: {{ $refs.db.passwordProperty }} }
{{- if .Values.config.keycloak.adminUrl }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.keycloakReader.name }}
  labels:
    {{- include "pifa.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $store.name }}
    kind: {{ $store.kind }}
  target:
    name: {{ .Values.secrets.keycloakReader.name }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.secrets.keycloakReader.key }}
      remoteRef: { key: {{ $refs.keycloakReader.key }}, property: {{ $refs.keycloakReader.property }} }
{{- end }}
---
# Worker only: SFTP private key and the server's known_hosts (strict host-key checking).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.sftp.name }}
  labels:
    {{- include "pifa.componentLabels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $store.name }}
    kind: {{ $store.kind }}
  target:
    name: {{ .Values.secrets.sftp.name }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.secrets.sftp.privateKeyKey }}
      remoteRef: { key: {{ $refs.sftp.key }}, property: {{ $refs.sftp.privateKeyProperty }} }
    - secretKey: {{ .Values.secrets.sftp.knownHostsKey }}
      remoteRef: { key: {{ $refs.sftp.key }}, property: {{ $refs.sftp.knownHostsProperty }} }
{{- if and .Values.config.clamav.enabled (ne .Values.secrets.clamavCa.name .Values.secrets.clamavTls.name) }}
---
# CA certificate the api/worker trust for the ClamAV TLS connection. Skipped when secrets.clamavCa.name points
# at the cert-manager Secret (its ca.crt key), which must not be overwritten by a second writer.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.clamavCa.name }}
  labels:
    {{- include "pifa.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $store.name }}
    kind: {{ $store.kind }}
  target:
    name: {{ .Values.secrets.clamavCa.name }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.secrets.clamavCa.key }}
      remoteRef: { key: {{ $refs.clamavCa.key }}, property: {{ $refs.clamavCa.property }} }
{{- end }}
{{- if and .Values.clamav.enabled (not .Values.clamav.tls.certManager.enabled) }}
---
# Server certificate and key of the ClamAV TLS sidecar (only when cert-manager does not issue them).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.clamavTls.name }}
  labels:
    {{- include "pifa.componentLabels" (dict "root" . "component" "clamav") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $store.name }}
    kind: {{ $store.kind }}
  target:
    name: {{ .Values.secrets.clamavTls.name }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef: { key: {{ $refs.clamavTls.key }}, property: {{ $refs.clamavTls.certProperty }} }
    - secretKey: tls.key
      remoteRef: { key: {{ $refs.clamavTls.key }}, property: {{ $refs.clamavTls.keyProperty }} }
{{- end }}
{{- end }}
