# docker-compose.yml - the local development stack.
# Start:  docker compose -f infra/docker-compose.yml up -d
# Stop:   docker compose -f infra/docker-compose.yml down        (add -v to also delete data)
# Every credential below is a DEV-ONLY value for a laptop. Never reuse them in any shared or
# production environment (those get secrets from a secret manager).
services:

  # PostgreSQL 16: the main business database (Flyway creates the tables when the API starts).
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pifa          # database created on first start
      POSTGRES_USER: pifa
      POSTGRES_PASSWORD: pifa
    ports: ["5432:5432"]         # host:container; matches the defaults in application.yml
    volumes: [pgdata:/var/lib/postgresql/data]   # named volume keeps data across restarts
    healthcheck:                 # compose marks the service healthy once Postgres accepts connections
      test: ["CMD-SHELL", "pg_isready -U pifa"]
      interval: 5s
      retries: 10

  # Keycloak 26: login/SSO server. "start-dev" = single-node dev mode (no TLS). "--import-realm"
  # loads every JSON file in /opt/keycloak/data/import on first start, which creates realm
  # pifa-dev with its roles, clients and test users.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin   # admin-console login (master realm), dev only
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8081                    # 8081 because the API uses 8080
    ports: ["8081:8081"]
    volumes:
      # Read-only mount of the realm-as-code file. See infra/keycloak/README.md for its contents.
      - ./keycloak/realm-pifa-dev.json:/opt/keycloak/data/import/realm-pifa-dev.json:ro

  # MinIO: S3-compatible object storage for raw Excel files, exports and error reports.
  # API on :9000, web console on :9001.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pifa
      MINIO_ROOT_PASSWORD: pifa-minio-dev
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  # SFTP server that stands in for the upstream systems drop box.
  # Each command line is  user:password:uid:gid:folder . Every account is locked (chrooted) to its
  # own home, so sftp-forecast can only reach inbound/forecast and sftp-inventory only
  # inbound/inventory. This is how the folder decides which dashboard receives the file
  # (PRD section 8.2).
  #
  # Three accounts: two producers that only drop files, and pifa-worker, the account the API/poller
  # uses to read, archive and write error reports. The drop folders are shared named volumes mounted
  # into both the producer home and the worker home, so a producer upload is visible to the worker.
  sftp:
    image: atmoz/sftp
    depends_on:
      sftp-init: { condition: service_completed_successfully }
    command:
      - sftp-forecast:forecast-dev:1001:100:inbound/forecast,outbound/errors
      - sftp-inventory:inventory-dev:1002:100:inbound/inventory,outbound/errors
      - sftp-sales:sales-dev:1003:100:inbound/sales,outbound/errors
      - pifa-worker:worker-dev:1000:100:inbound/forecast,inbound/inventory,inbound/sales,outbound/errors,archive
    ports: ["2222:22"]           # host port 2222 so it does not clash with a local SSH server
    volumes:
      - forecast-drop:/home/sftp-forecast/inbound/forecast
      - forecast-drop:/home/pifa-worker/inbound/forecast
      - inventory-drop:/home/sftp-inventory/inbound/inventory
      - inventory-drop:/home/pifa-worker/inbound/inventory
      - sales-drop:/home/sftp-sales/inbound/sales
      - sales-drop:/home/pifa-worker/inbound/sales
      - error-reports:/home/sftp-forecast/outbound/errors
      - error-reports:/home/sftp-inventory/outbound/errors
      - error-reports:/home/sftp-sales/outbound/errors
      - error-reports:/home/pifa-worker/outbound/errors
      - archive:/home/pifa-worker/archive

  # One-shot job that makes the shared SFTP volumes writable for every account (they have different
  # uids). It runs BEFORE the sftp service starts and does not depend on file permission bits of the
  # repository checkout (an earlier shell script did, and was silently skipped on a Linux CI runner,
  # which gave "Permission denied" on upload). Local development only.
  sftp-init:
    image: busybox
    command: ["sh", "-c", "chmod -R 777 /drops"]
    volumes:
      - forecast-drop:/drops/forecast
      - inventory-drop:/drops/inventory
      - sales-drop:/drops/sales
      - error-reports:/drops/errors
      - archive:/drops/archive

  # ClamAV antivirus daemon. clamd speaks plain TCP, so it is NOT published to the host: only the TLS
  # terminator below (clamav-tls) can reach it, and the application only ever connects over TLS.
  clamav:
    image: clamav/clamav:stable

  # One-shot job: creates a self-signed certificate for the TLS terminator (development only; production
  # uses a certificate from the organisation CA). The certificate is valid for the names clamav-tls,
  # localhost and 127.0.0.1, so the client's host-name check passes for either. ca.pem is what the
  # application trusts (PIFA_CLAMAV_CA_CERT); server.key never leaves the shared volume.
  clamav-cert:
    image: alpine/openssl
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -s /certs/server.crt ] || {
          openssl req -x509 -newkey rsa:2048 -nodes -days 365 -subj "/CN=clamav-tls" \
            -addext "subjectAltName=DNS:clamav-tls,DNS:localhost,IP:127.0.0.1" \
            -keyout /certs/server.key -out /certs/server.crt
          cp /certs/server.crt /certs/ca.pem
          chmod 644 /certs/server.crt /certs/ca.pem /certs/server.key
        }
    volumes: [clamav-certs:/certs]

  # TLS terminator in front of clamd: accepts TLS on 3311 and forwards the plain stream to clamd on the
  # internal compose network. Published on 3311 for the application and the tests.
  clamav-tls:
    image: alpine/socat
    command: ["OPENSSL-LISTEN:3311,fork,reuseaddr,cert=/certs/server.crt,key=/certs/server.key,verify=0", "TCP:clamav:3310"]
    ports: ["3311:3311"]
    volumes: [clamav-certs:/certs:ro]
    depends_on:
      clamav-cert: { condition: service_completed_successfully }
      clamav: { condition: service_started }

  # Mailpit: a fake SMTP server that catches outgoing emails. SMTP on :1025, inbox UI on :8025.
  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]

# Named volumes: data that survives `docker compose down` (deleted only by `down -v`).
volumes:
  pgdata:
  miniodata:
  forecast-drop:      # shared SFTP drop folder for forecast files
  inventory-drop:     # shared SFTP drop folder for inventory files
  sales-drop:         # shared SFTP drop folder for the monthly sales feed (Phase 7)
  error-reports:      # error CSVs written by the worker, readable by the producers
  archive:            # processed files moved here by the worker
  clamav-certs:       # self-signed certificate of the ClamAV TLS terminator (development only)
