# nginx.conf - serves the single-page app. Used by frontend/Dockerfile; the Helm chart may override it.
# The API is NOT proxied here: the ingress routes /api to the API service.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Security headers (architecture.md 11/12). CSP: only our own scripts; the browser may call our API and the
    # Keycloak origin (adjust connect-src to the real SSO host, or use the Helm chart's nginx config).
    # They are declared ONLY here: nginx drops inherited add_header lines in any block that has its own
    # add_header, so the locations below set caching with "expires" instead of add_header.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://sso.example.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Hashed asset files never change: cache them for a year (Cache-Control: max-age=31536000).
    location /assets/ {
        expires 1y;
    }
    # index.html must always be revalidated so a new release is picked up immediately (Cache-Control: no-cache).
    location / {
        try_files $uri /index.html;   # client-side routes (/planner, /admin ...) all serve the app
        expires -1;
    }
}
